<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاني ستور - Hany Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .header {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cat-btn {
            background-color: #f1f1f1;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .cat-btn:hover {
            background-color: #ff6600;
            color: #fff;
        }
        /* --- تنسيق قسم المنتجات --- */
        .products-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .product-card h3 {
            margin: 10px 0;
            color: #333;
        }
        .product-price {
            color: #ff6600;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .buy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn:hover {
            background-color: #218838;
        }
        /* --- تنسيق قسم الفيديو الديني --- */
        .video-section {
            text-align: center;
            padding: 25px;
            background-color: #fff;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .video-section h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .video-section p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .video-container video {
            width: 100%;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- البانر العلوي -->
    <div class="header">
        <h1>متجر هاني ستور</h1>
        <p>متجرك الشامل لجميع أنواع الملابس، والأجهزة الإلكترونية</p>
        <span style="font-size: 0.9rem; opacity: 0.8;">📞 01067573766 | 01094247457 تحت إشراف هاني محمود عواد</span>
    </div>

    <!-- أزرار الفئات -->
    <div class="categories">
        <button class="cat-btn">الكل</button>
        <button class="cat-btn">ملابس</button>
        <button class="cat-btn">أجهزة إلكترونية</button>
        <button class="cat-btn">فيديوهات تذكيرية</button>
    </div>

    <!-- قسم المنتجات المعروضة -->
    <div class="products-container">
        
        <!-- المنتج الأول: هدوم (ملابس رجالي) -->
        <div class="product-card">
            <h3>تيشيرت رجالي شيك</h3>
            <div class="product-price">350 جنيه</div>
            <button class="buy-btn">اطلب الان</button>
        </div>

        <!-- المنتج الثاني: هدوم (عباية حريمي) -->
        <div class="product-card">
            <h3>عباية حريمي راقية</h3>
            <div class="product-price">450 جنيه</div>
            <button class="buy-btn">اطلب الان</button>
        </div>

    </div>

    <!-- ================================================= -->
    <!-- 📍 المنتج الثالث (قسم الفيديو الديني والتذكيري)  -->
    <!-- ================================================= -->
    <div class="video-section">
        <h3>🌱 ركن التذكرة والدين</h3>
        <p>فيديو قصير للتذكير بذكر الله وفضل الأعمال الصالحة</p>
        
        <div class="video-container">
            <!-- 
              ملاحظة يا فنان: عشان الفيديو يشتغل، سمي الفيديو الديني بتاعك 'video.mp4' 
              وارفعه في نفس المستودع مع ملف index.html ده على جيت هب!
            -->
            <video controls>
                <source src="video.mp4" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
        </div>
    </div>
    <!-- ================================================= -->

</body>
</html>
